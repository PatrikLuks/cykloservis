name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand('ping')'" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: |
          cd server
          npm ci
      - name: Install frontend dependencies
        run: |
          cd client
          npm ci
      - name: Run backend tests
        run: |
          cd server
          npm test
      # Lint (volitelně, pokud je nastaveno)
      - name: Run backend lint
        run: |
          cd server
          if [ -f package.json ] && grep -q '"lint"' package.json; then npm run lint || true; fi
      - name: Run frontend lint
        run: |
          cd client
          if [ -f package.json ] && grep -q '"lint"' package.json; then npm run lint || true; fi
